# Fetches new lines from linked banks. Once a day stays well under the 4
# background fetches a day many banks allow, and finishes at once when bank
# sync isn't set up. Forbid: a run never starts while another is going.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bank-sync
  namespace: reconciled
  labels:
    app.kubernetes.io/instance: reconciled
    app.kubernetes.io/name: reconciled-bank-sync
spec:
  # UTC. Keep BANK_SYNC_TIMES in configmap.yaml equal to it.
  schedule: "30 11 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: ghcr.io/vmangelschots/reconciled-backend:latest
              imagePullPolicy: Always
              command: ["python", "manage.py", "sync_banks"]
              envFrom:
                - configMapRef: { name: reconciled-config }
                - secretRef: { name: reconciled-secrets }
              resources:
                requests: { cpu: 50m, memory: 192Mi }
                limits: { memory: 512Mi }
