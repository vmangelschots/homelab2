# Django backend + nginx frontend behind one hostname: /api, /admin and
# /static go to the backend, everything else to the frontend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciled-backend
  namespace: reconciled
  labels:
    app.kubernetes.io/name: reconciled-backend
    app.kubernetes.io/instance: reconciled
spec:
  replicas: 1
  # Never run an old and a new backend against a just-migrated database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reconciled-backend
  template:
    metadata:
      labels:
        app: reconciled-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-svc 5432; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        # Migrations + idempotent creation of the login user from the secret.
        - name: migrate
          image: ghcr.io/vmangelschots/reconciled-backend:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_user"]
          envFrom:
            - configMapRef:
                name: reconciled-config
            - secretRef:
                name: reconciled-secrets
      containers:
        - name: backend
          image: ghcr.io/vmangelschots/reconciled-backend:latest
          imagePullPolicy: Always
          # Overrides the image entrypoint, which would migrate again.
          command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: reconciled-config
            - secretRef:
                name: reconciled-secrets
          # Host: localhost, otherwise Django rejects the pod IP as Host.
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reconciled-backend-svc
  namespace: reconciled
  labels:
    app.kubernetes.io/name: reconciled-backend
spec:
  type: ClusterIP
  selector:
    app: reconciled-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciled-frontend
  namespace: reconciled
  labels:
    app.kubernetes.io/name: reconciled-frontend
    app.kubernetes.io/instance: reconciled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciled-frontend
  template:
    metadata:
      labels:
        app: reconciled-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/vmangelschots/reconciled-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reconciled-frontend-svc
  namespace: reconciled
  labels:
    app.kubernetes.io/name: reconciled-frontend
spec:
  type: ClusterIP
  selector:
    app: reconciled-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reconciled
  namespace: reconciled
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - reconciled.mangelschots.org
      secretName: reconciled-mangelschots-org-tls
  rules:
    - host: reconciled.mangelschots.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: reconciled-backend-svc
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: reconciled-backend-svc
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: reconciled-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciled-frontend-svc
                port:
                  number: 80
---
# Traefik has no global http->https redirect; send plain-http requests to https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: reconciled
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reconciled-http
  namespace: reconciled
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: reconciled-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: reconciled.mangelschots.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconciled-frontend-svc
                port:
                  number: 80
