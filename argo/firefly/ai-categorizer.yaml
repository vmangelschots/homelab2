apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-ai-categorizer-data
  namespace: firefly
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-retain
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-ai-categorizer
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-ai-categorizer
  template:
    metadata:
      labels:
        app: firefly-ai-categorizer
    spec:
      containers:
        - name: ai-categorizer
          image: ghcr.io/ejagombar/fireflyiii-ai-categorizer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data

          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-ai-categorizer-data

---
apiVersion: v1
kind: Service
metadata:
  name: firefly-ai-categorizer
  namespace: firefly
spec:
  selector:
    app: firefly-ai-categorizer
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
# No built-in authentication upstream - restrict to internal networks only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly-ai-categorizer
  namespace: firefly
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-internal-whitelist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - firefly-ai.mangelschots.org
      secretName: firefly-ai-mangelschots-org-tls
  rules:
    - host: firefly-ai.mangelschots.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-ai-categorizer
                port:
                  number: 80
